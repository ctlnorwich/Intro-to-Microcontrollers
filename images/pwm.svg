<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Three PWM waveforms at 10, 50 and 90 percent on, each next to an LED drawn at the matching brightness">
<title>Three PWM waveforms at 10, 50 and 90 percent on, each next to an LED drawn at the matching brightness</title>
<rect width="960" height="420" fill="#ffffff"/>
<g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" fill="#222">
<text x="40" y="40" font-size="22" font-weight="bold">PWM: faking "half on" by flickering very fast</text><text x="40" y="66" font-size="15" fill="#888">The pin is only ever fully on (5 V) or fully off (0 V). What changes is how much of the time it spends on.</text><text x="40" y="133" font-size="18" font-family="Menlo, Consolas, monospace">analogWrite(pin, 25)</text><text x="40" y="157" font-size="15" fill="#888">on 10% of the time</text><line x1="320" y1="165" x2="770" y2="165" stroke="#ddd"/><path d="M320.0,165.0 L320.0,105.0 L327.4,105.0 L327.4,165.0 L395.0,165.0 L395.0,165.0 L395.0,105.0 L402.4,105.0 L402.4,165.0 L470.0,165.0 L470.0,165.0 L470.0,105.0 L477.3,105.0 L477.3,165.0 L545.0,165.0 L545.0,165.0 L545.0,105.0 L552.4,105.0 L552.4,165.0 L620.0,165.0 L620.0,165.0 L620.0,105.0 L627.4,105.0 L627.4,165.0 L695.0,165.0 L695.0,165.0 L695.0,105.0 L702.3,105.0 L702.3,165.0 L770.0,165.0" fill="none" stroke="#1f8fbf" stroke-width="2.5" stroke-linejoin="round" /><circle cx="850" cy="135.0" r="34" fill="#e5398b" opacity="0.17"/><circle cx="850" cy="135.0" r="34" fill="none" stroke="#bbb" stroke-width="2"/><text x="40" y="238" font-size="18" font-family="Menlo, Consolas, monospace">analogWrite(pin, 127)</text><text x="40" y="262" font-size="15" fill="#888">on 50% of the time</text><line x1="320" y1="270" x2="770" y2="270" stroke="#ddd"/><path d="M320.0,270.0 L320.0,210.0 L357.4,210.0 L357.4,270.0 L395.0,270.0 L395.0,270.0 L395.0,210.0 L432.3,210.0 L432.3,270.0 L470.0,270.0 L470.0,270.0 L470.0,210.0 L507.4,210.0 L507.4,270.0 L545.0,270.0 L545.0,270.0 L545.0,210.0 L582.4,210.0 L582.4,270.0 L620.0,270.0 L620.0,270.0 L620.0,210.0 L657.3,210.0 L657.3,270.0 L695.0,270.0 L695.0,270.0 L695.0,210.0 L732.4,210.0 L732.4,270.0 L770.0,270.0" fill="none" stroke="#1f8fbf" stroke-width="2.5" stroke-linejoin="round" /><circle cx="850" cy="240.0" r="34" fill="#e5398b" opacity="0.54"/><circle cx="850" cy="240.0" r="34" fill="none" stroke="#bbb" stroke-width="2"/><text x="40" y="343" font-size="18" font-family="Menlo, Consolas, monospace">analogWrite(pin, 230)</text><text x="40" y="367" font-size="15" fill="#888">on 90% of the time</text><line x1="320" y1="375" x2="770" y2="375" stroke="#ddd"/><path d="M320.0,375.0 L320.0,315.0 L387.7,315.0 L387.7,375.0 L395.0,375.0 L395.0,375.0 L395.0,315.0 L462.6,315.0 L462.6,375.0 L470.0,375.0 L470.0,375.0 L470.0,315.0 L537.6,315.0 L537.6,375.0 L545.0,375.0 L545.0,375.0 L545.0,315.0 L612.7,315.0 L612.7,375.0 L620.0,375.0 L620.0,375.0 L620.0,315.0 L687.6,315.0 L687.6,375.0 L695.0,375.0 L695.0,375.0 L695.0,315.0 L762.6,315.0 L762.6,375.0 L770.0,375.0" fill="none" stroke="#1f8fbf" stroke-width="2.5" stroke-linejoin="round" /><circle cx="850" cy="345.0" r="34" fill="#e5398b" opacity="0.91"/><circle cx="850" cy="345.0" r="34" fill="none" stroke="#bbb" stroke-width="2"/><text x="850" y="402" font-size="14" fill="#888" text-anchor="middle">what your eye sees</text><text x="770" y="402" font-size="14" fill="#888" text-anchor="end">time →</text>
</g>
</svg>
